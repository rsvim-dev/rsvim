name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 3
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"
  RSVIM_LOG: "trace"
  RUST_BACKTRACE: "full"
  # RUSTC_LOG: "rustc_codegen_ssa::back::link=info"
jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Tsc
        run: |
          npm install -g typescript
          npm install -g terser
          tsc --version
          echo "show PWD=${PWD}"
          echo "./dev.py fmt --tsc"
          python3 ./dev.py fmt --tsc
          git diff --exit-code HEAD
      - name: Taplo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-linux-x86_64.gz | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
          taplo --version
          taplo check
          taplo fmt --check
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories --allow unmaintained
      - uses: davidlattimore/wild-action@latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Rustfmt
        run: cargo +nightly fmt --check
      - name: Docs
        run: cargo doc --workspace
  clippy:
    name: Clippy
    strategy:
      matrix:
        toolchain: [stable, 1.89.0]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: davidlattimore/wild-action@latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets
  unit_test:
    name: Unit Test
    strategy:
      matrix:
        os: [ubuntu-22.04-arm, macos-15-intel, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Swatinem/rust-cache@v2
      - uses: davidlattimore/wild-action@latest
        if: ${{ contains(matrix.os, 'ubuntu') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Test
        run: cargo test --color=never --workspace
      - name: Test (--no-default-features)
        if: ${{ contains(matrix.os, 'ubuntu') }}
        run: cargo test --no-default-features --color=never --workspace
  unit_test_coverage:
    name: Unit Test with Coverage
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Swatinem/rust-cache@v2
      - uses: davidlattimore/wild-action@latest
        if: ${{ contains(matrix.os, 'ubuntu') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src,clippy,llvm-tools
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Nextest (--no-default-features)
        if: ${{ contains(matrix.os, 'ubuntu') }}
        run: cargo nextest run --no-capture --no-default-features --color=never --workspace
      - name: Nextest with code coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --ignore-filename-regex '_tests.rs|tests' --lcov --output-path lcov.info --color=never --no-capture
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            profile: --release
          - os: ubuntu-22.04
            profile: --profile nightly
          - os: windows-2022
            profile: --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Swatinem/rust-cache@v2
      - uses: davidlattimore/wild-action@latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build ${{ matrix.profile }}
      - name: Build (--no-default-features)
        run: cargo build --no-default-features ${{ matrix.profile }}
