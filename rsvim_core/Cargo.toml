[package]
authors.workspace = true
categories.workspace = true
description = "The core library for RSVIM text editor."
documentation.workspace = true
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
name = "rsvim_core"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
doctest = false

[features]
default = ["unicode", "simd"]
simd = ["ropey/simd"]
unicode = ["ropey/unicode_lines"]

[dependencies]
rsvim_macro = { workspace = true }

arcstr = { workspace = true, features = ["std"] }
ascii = { workspace = true }
clap = { workspace = true, default-features = false, features = [
  "std",
  "help",
  "usage",
  "derive",
] }
compact_str = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
derive-where = { workspace = true }
derive_builder = { workspace = true }
dirs = { workspace = true }
encoding_rs = { workspace = true }
env_filter = { workspace = true }
fern = { workspace = true }
foldhash = { workspace = true }
futures = { workspace = true }
geo = { workspace = true }
icu = { workspace = true, features = ["compiled_data"] }
itertools = { workspace = true }
jiff = { workspace = true }
junction = { workspace = true }
litemap = { workspace = true }
log = { workspace = true, features = [
  "max_level_trace",
  "release_max_level_error",
] }
lru = { workspace = true }
normpath = { workspace = true }
num-traits = { workspace = true }
oxc_resolver = { workspace = true }
paste = { workspace = true }
path-absolutize = { workspace = true }
postcard = { workspace = true, default-features = false, features = [
  "use-std",
] }
roaring = { workspace = true }
ropey = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
taffy = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { workspace = true, features = ["full"] }
toml = { workspace = true, features = ["fast_hash"] }
tree-sitter = { workspace = true }
tree-sitter-loader = { workspace = true }

# js engine
v8 = { workspace = true, default-features = false, features = [
  "use_custom_libcxx",
  "simdutf",
] }

[dev-dependencies]
assert_fs = { workspace = true }
bitflags = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
fastrand = { workspace = true }
regex = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-html = { workspace = true }
tree-sitter-md = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
unicode-width = { workspace = true }

[lints]
workspace = true

[[bench]]
harness = false
name = "canvas_shade"

[[bench]]
harness = false
name = "viewport_search_nowrap"

[[bench]]
harness = false
name = "viewport_search_wrap_nolinebreak"

[[bench]]
harness = false
name = "viewport_search_wrap_linebreak"
