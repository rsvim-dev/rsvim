[workspace]
members = ["rsvim_cli", "rsvim_core", "rsvim_macro"]
resolver = "3"

[workspace.package]
authors = ["Lin Rongbin <linrongbin16@outlook.com>"]
categories = ["text-editors"]
documentation = "https://rsvim.github.io/"
edition = "2024"
exclude = [".DS_Store"]
homepage = "https://rsvim.github.io/"
keywords = ["editor", "neovim", "terminal", "text-editor", "vim"]
license = "Vim"
readme = "README.md"
repository = "https://github.com/rsvim/rsvim"
rust-version = "1.90.0"
version = "0.1.3-alpha.2"

[workspace.dependencies]
rsvim_core = { version = "0.1.3-alpha.2", path = "./rsvim_core" }
rsvim_macro = { version = "0.1.3-alpha.2", path = "./rsvim_macro" }

arcstr = { version = "1.2", features = ["std"] }
ascii = "1.1"
assert_fs = "1.1"
bitflags = "2.12"
clap = { version = "4.6", default-features = false, features = [
  "std",
  "help",
  "usage",
  "derive",
] }
compact_str = "0.10"
criterion = { version = "0.8", features = ["async_tokio"] }
crossterm = { version = "0.29", features = ["event-stream"] }
derive-where = "1.6"
derive_builder = "0.20"
dirs = "7.0"
encoding_rs = "0.8"
env_filter = "2.0"
fastrand = "2.4"
fern = "0.7"
foldhash = "0.2"
futures = "0.3"
geo = "0.33.1"
gix = "0.89"
heck = "0.5"
icu = { version = "2", features = ["compiled_data"] }
itertools = "0.15"
jiff = "0.2"
junction = "2"
litemap = "0.8"
log = { version = "0.4", features = [
  "max_level_trace",
  "release_max_level_error",
] }
lru = "0.18"
mimalloc = "0.1"
normpath = "1.5"
num-traits = "0.2"
oxc_resolver = "11.21"
paste = "1.0"
path-absolutize = "4.0"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proc-macro2 = "1"
quote = "1"
regex = "1.12"
roaring = "0.11"
ropey = { version = "1.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15"
strum = "0.28"
strum_macros = "0.28"
syn = { version = "2", features = ["extra-traits"] }
taffy = "0.15"
thiserror = "2"
tikv-jemallocator = "0.7"
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["full"] }
toml = { version = "1.1", features = ["fast_hash"] }
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-html = "0.23"
tree-sitter-loader = "0.27"
tree-sitter-md = "0.5"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
unicode-width = "0.2"

# js engine
v8 = { version = "=150.4.0", default-features = false, features = [
  "use_custom_libcxx",
  "simdutf",
] }

[workspace.lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
double_must_use = "allow"
new_without_default = "allow"
nonminimal_bool = "allow"
type_complexity = "allow"

# Debug
[profile.dev.package.v8]
opt-level = 1

# Nightly
[profile.nightly]
debug = true
debug-assertions = true
inherits = "release"
panic = "unwind"

# Release
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
